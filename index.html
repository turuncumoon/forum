<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>forum.sh — Topluluk terminali</title>
<style>
:root{color-scheme:dark;--bg:#1a1209;--panel:#21180e;--ink:#ffb000;--line:#594122;--dim:#c29d66;--paper:#ffe0a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:16px/1.55 "IBM Plex Mono",Consolas,"Liberation Mono",monospace}main,header>div,footer{width:min(1150px,92%);margin:auto}header{border-bottom:1px solid var(--line)}header>div,footer,.bar,.end,.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}header>div{height:60px}button,input,textarea,select{font:inherit;color:inherit}button,a,select{cursor:pointer}button{background:transparent;border:0}a{color:inherit}.brand{font-weight:700;font-size:21px;text-decoration:none;color:var(--ink)}small,.meta,.path,footer,.label{font-size:13px;color:var(--dim)}.hero{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);background:repeating-linear-gradient(0deg,#ffb00005 0 1px,transparent 1px 4px),linear-gradient(100deg,#21180e,#30200d);margin:30px 0 24px;padding:24px 30px}.hero h1{font-size:clamp(46px,7vw,82px);letter-spacing:-.085em;line-height:1.06;margin:7px 0;color:var(--ink)}.cursor{display:inline-block;width:.35em;height:.7em;background:currentColor;margin-left:.13em;animation:blink 1.5s steps(1) infinite}@keyframes blink{60%{opacity:.2}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}.hero p{margin:10px 0 0}.hero canvas{position:absolute;right:5%;top:10%;width:28%;height:80%;object-fit:contain;image-rendering:pixelated;z-index:-1}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:24px}.box,.board{border:1px solid var(--line);background:var(--panel)}.box{padding:16px;margin-bottom:16px}.label{letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:11px}.category{display:flex;align-items:center;text-align:left;gap:9px;width:100%;padding:8px 10px;color:var(--dim)}.category span{margin-left:auto;font-size:13px}.category.active,.primary{background:var(--ink);color:var(--bg);font-weight:700}.category:hover:not(.active),article:hover{background:#302414}.stats p{display:flex;justify-content:space-between;margin:8px 0;color:var(--dim);font-size:14px}.stats b{color:var(--paper)}.board{padding:22px}.bar{margin-bottom:17px}.bar h2{font-size:22px;margin:0;letter-spacing:-1px}.primary,.ghost{padding:9px 15px;border:1px solid var(--ink)}.ghost{color:var(--ink)}.filters{display:flex;gap:10px;margin-bottom:12px}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);padding:9px 12px;border-radius:0}select{width:auto}.filters input{min-width:0}.topic{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:17px 0;border-top:1px dashed var(--line)}.vote{border:1px solid var(--line);font-size:14px;color:var(--ink);min-height:44px}.vote[aria-pressed=true]{background:var(--ink);color:var(--bg)}.title{font-size:16px;font-weight:bold;overflow-wrap:anywhere;text-decoration:none}.title:hover{text-decoration:underline;color:var(--ink)}.meta{justify-content:flex-start;flex-wrap:wrap;margin-top:5px;gap:6px 12px}.tag{color:var(--ink)}.replies{text-align:right;font-size:13px;color:var(--dim)}footer{margin:22px auto;padding:13px 0;border-top:1px solid var(--line)}dialog{background:var(--panel);color:var(--paper);border:1px solid var(--ink);width:min(620px,94vw);max-height:88vh;padding:24px}dialog::backdrop{background:#0c0804cc}dialog h2{color:var(--ink);margin:0 0 14px;font-size:21px;overflow-wrap:anywhere}form,label{display:grid;gap:5px}form{gap:13px}label{font-size:14px}textarea{resize:vertical;min-height:86px}label select{width:100%}.end{justify-content:flex-end}.message{white-space:pre-wrap;overflow-wrap:anywhere}.reply{border-top:1px dashed var(--line);padding:12px 0}.reply p{margin:3px 0}.empty{padding:24px 0}.path{color:var(--dim)}:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}@media(max-width:740px){.layout{grid-template-columns:1fr;gap:12px}.stats{display:none}.box{margin:0}.categories{display:flex;flex-wrap:wrap}.category{width:auto;font-size:14px}.category span{display:none}.hero{margin:15px 0;padding:20px}.board{padding:15px}.hero canvas{opacity:.48;right:1%}.topic{gap:10px;grid-template-columns:39px 1fr}.replies{grid-column:2;text-align:left;margin-top:-6px}.bar h2{font-size:18px}.primary{padding:8px 10px}.filters select{max-width:45%}}@media(max-width:440px){.hero canvas{width:22%;top:0}.hero p{font-size:14px}.filters,.bar{flex-wrap:wrap}.filters input{flex:1}.path{font-size:12px}}
</style>
<header><div><a class="brand" href="#">[&gt;_] forum.sh</a><span class="path">~/topluluk/forum</span></div></header>
<main><section class="hero"><small>$ forum --başlat</small><h1>forum.sh<span class="cursor"></span></h1><p>Yazılım, projeler ve terminal sohbetleri.</p><canvas width="134" height="72" id="art" aria-hidden="true"></canvas></section>
<div class="layout"><aside><section class="box"><strong class="label">~/ kategoriler</strong><nav class="categories" aria-label="Kategoriler"></nav></section><section class="box stats"><strong class="label">Forum istatistikleri</strong><p>Toplam konu <b id="total"></b></p><p>Toplam yanıt <b id="responses"></b></p></section></aside>
<section class="board"><div class="bar"><h2 id="heading">Tüm konular</h2><button class="primary" id="create">+ Yeni konu</button></div><div class="filters"><input type="search" id="query" placeholder="⌕ Konularda ara..." aria-label="Konularda ara"><select aria-label="Konuları sırala" id="sort"><option value="new">En yeni</option><option value="votes">En çok oy</option><option value="replies">En çok yanıt</option></select></div><div id="list"></div><small id="count" role="status"></small></section></div></main><footer><span>forum.sh</span><span>Yerel oturum</span></footer>
<dialog id="compose" aria-labelledby="composeTitle"><h2 id="composeTitle">$ Yeni konu</h2><form id="postForm"><label>Başlık<input required maxlength="120" name="title"></label><label>Kategori<select name="category"></select></label><label>Kullanıcı adı<input maxlength="30" name="author" placeholder="misafir"></label><label>Mesaj<textarea required name="body" maxlength="5000"></textarea></label><div class="end"><button type="button" class="ghost" data-close>Vazgeç</button><button class="primary">Konuyu aç</button></div></form></dialog>
<dialog id="thread" aria-labelledby="threadTitle"><div class="bar"><small id="threadCat"></small><button class="ghost" data-close>Kapat</button></div><h2 id="threadTitle"></h2><small id="by"></small><p class="message" id="bodyText"></p><h3 id="replyHeading"></h3><div id="comments"></div><form id="replyForm"><label>Kullanıcı adı<input name="author" maxlength="30" placeholder="misafir"></label><label>Yanıtın<textarea name="body" required maxlength="5000"></textarea></label><div class="end"><button class="primary">Yanıt gönder</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), cats=['Genel','Yardım','Proje','Sohbet'], key='forum-sh-topluluk-v1';
const examples=[
['Haftalık proje paylaşımı','Proje','mert','Bu hafta küçük bir RSS okuyucu yazdım. Sizin üzerinde çalıştığınız projeler neler?',18,'elif','Ben de çizim defterimi web sayfasına dönüştürüyorum.'],
['GitHub Pages’te özel alan adı nasıl bağlanır?','Yardım','elif','İlk kişisel sitemi hazırladım. Özel alan adı ayarlarını hangi sırayla yaptınız?',24],
['Forum kurallarını birlikte yazalım','Genel','deniz','İlk önerim, yardım isterken denediğimiz adımları konuya eklemek. Sizce başka neler olmalı?',12,'can','Sorunu çözdüğümüzde çözümü de paylaşalım.'],
['Hangi editörü kullanıyorsunuz, neden?','Sohbet','zeynep','Ben klavye kısayollarını kendime göre ayarlayabildiğim editörleri seviyorum. Sizin vazgeçilmez özelliğiniz hangisi?',9],
['Statik bir sitede aramayı nasıl tasarlarsınız?','Yardım','can','Küçük bir arşiv hazırlıyorum. Başlık aramasına etiketleri de eklemeyi düşünüyorum.',7],
['İlk açık kaynak katkım kabul edildi','Sohbet','derya','Bir projenin kurulum belgesindeki eksik adımı düzelttim. Küçük bir katkıyla başlamak cesaret verdi.',31,'mert','Tebrikler! Kurulum belgeleri benim de ilk baktığım yer.']];
const seed=examples.map(([title,category,author,body,votes,a,b],i)=>({id:'t'+i,title,category,author,body,votes,time:Date.now()-(i+1)*3600000,replies:a?[{author:a,body:b}]:[],voted:false}));
let topics=seed,category='Tümü',current;
try{const stored=JSON.parse(localStorage.getItem(key));if(Array.isArray(stored)&&stored.every(t=>t&&Array.isArray(t.replies)&&cats.includes(t.category)))topics=stored}catch{}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(topics))}catch{alert('Tarayıcı kayıt alanına yazılamadı. Değişiklik bu oturumda görünür.')}render()}
const date=t=>new Intl.DateTimeFormat('tr',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(t);
function render(){
 $('.categories').innerHTML=['Tümü',...cats].map(c=>'<button class="category '+(c===category?'active':'')+'" aria-pressed="'+(c===category)+'" data-cat="'+c+'">['+(c===category?'x':' ')+'] '+c+'<span>'+topics.filter(t=>c==='Tümü'||t.category===c).length+'</span></button>').join('');
 $('#heading').textContent=category==='Tümü'?'Tüm konular':category;
 const q=$('#query').value.trim().toLocaleLowerCase('tr'),sort=$('#sort').value;
 const rows=topics.filter(t=>(category==='Tümü'||category===t.category)&&[t.title,t.author,t.body].join(' ').toLocaleLowerCase('tr').includes(q)).sort((a,b)=>(sort==='votes'?b.votes-a.votes:sort==='replies'?b.replies.length-a.replies.length:0)||b.time-a.time);
 $('#list').innerHTML=rows.map(t=>'<article class="topic"><button class="vote" aria-label="Oy '+(t.voted?'kaldır':'ver')+'" aria-pressed="'+!!t.voted+'" data-vote="'+escapeHtml(t.id)+'">▴<br>'+t.votes+'</button><div><a class="title" href="#konu/'+encodeURIComponent(t.id)+'">'+escapeHtml(t.title)+'</a><div class="meta"><span class="tag">#'+escapeHtml(t.category)+'</span><span>@'+escapeHtml(t.author)+'</span><span>'+date(t.time)+'</span></div></div><span class="replies">'+t.replies.length+' yanıt</span></article>').join('')||'<p class="empty">Bu aramada konu bulunamadı.</p>';
 $('#count').textContent=rows.length+' konu listelendi';$('#total').textContent=topics.length;$('#responses').textContent=topics.reduce((n,t)=>n+t.replies.length,0)
}
$('.categories').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}};
$('#query').oninput=render;$('#sort').onchange=render;
$('#list').onclick=e=>{const b=e.target.closest('[data-vote]');if(b){const t=topics.find(t=>t.id===b.dataset.vote);t.votes+=t.voted?-1:1;t.voted=!t.voted;save();$('#list').querySelector('[data-vote="'+t.id+'"]').focus()}};
$('#postForm select').innerHTML=cats.map(c=>'<option>'+c+'</option>').join('');
$('#create').onclick=()=>{$('#postForm select').value=category==='Tümü'?'Genel':category;$('#compose').showModal()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
function valid(form){for(const el of form.querySelectorAll('[required]')){if(!el.value.trim()){el.setCustomValidity('Lütfen bu alanı doldurun.');el.reportValidity();return false}}return true}
document.addEventListener('input',e=>e.target.setCustomValidity?.(''));
$('#postForm').onsubmit=e=>{e.preventDefault();const f=e.target;if(!valid(f))return;const data=new FormData(f),t={id:crypto.randomUUID(),title:data.get('title').trim(),category:data.get('category'),author:data.get('author').trim()||'misafir',body:data.get('body').trim(),time:Date.now(),votes:0,replies:[]};topics.unshift(t);category=t.category;$('#query').value='';$('#sort').value='new';save();f.reset();$('#compose').close();location.hash='konu/'+t.id};
function route(){current=topics.find(t=>'#konu/'+t.id===location.hash);if(!current){if($('#thread').open)$('#thread').close();return}
 $('#threadTitle').textContent=current.title;$('#threadCat').textContent='#'+current.category;$('#by').textContent='@'+current.author+' · '+date(current.time);$('#bodyText').textContent=current.body;$('#replyHeading').textContent='Yanıtlar ['+current.replies.length+']';$('#comments').innerHTML=current.replies.map(r=>'<div class="reply"><small>@'+escapeHtml(r.author)+'</small><p class="message">'+escapeHtml(r.body)+'</p></div>').join('');if(!$('#thread').open)$('#thread').showModal()}
$('#thread').onclose=()=>{$('#replyForm').reset();if(location.hash.startsWith('#konu/'))history.replaceState(null,'',location.href.split('#')[0])};
$('#replyForm').onsubmit=e=>{e.preventDefault();const f=e.target;if(!valid(f)||!current)return;current.replies.push({author:f.elements.author.value.trim()||'misafir',body:f.elements.body.value.trim()});save();f.reset();route();$('#comments').lastElementChild.scrollIntoView({block:'nearest'})};
window.onhashchange=route;render();route();
const ctx=$('#art').getContext('2d');
function bubble(x,y,w,h,front){ctx.fillStyle=front?'#30200d':'#24190e';ctx.fillRect(x,y,w,h);ctx.strokeStyle=front?'#ffb000':'#af7721';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+4,y);for(const [a,b] of [[w-4,0],[w-4,2],[w,2],[w,h-4],[w-3,h-4],[w-3,h],[22,h],[12,h+10],[12,h],[3,h],[3,h-3],[0,h-3],[0,3],[4,3],[4,0]])ctx.lineTo(x+a,y+b);ctx.stroke()}
bubble(56,5,65,35,false);ctx.fillStyle='#af7721';for(let i=0;i<3;i++)ctx.fillRect(80+i*7,19,3,3);bubble(13,20,66,35,true);ctx.fillStyle='#ffb000';for(let i=0;i<4;i++){ctx.fillRect(25+i*2,30+i*2,3,3);ctx.fillRect(25+i*2,42-i*2,3,3)}ctx.fillRect(41,43,12,3);
</script></html>
